<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!--
    Local-only page: scripts only from this folder, no network access at all, no forms,
    no plugins. Styles allow 'unsafe-inline' because CodeMirror injects its own style rules.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="editor.css">
  <script type="module" src="editor.js"></script>
</head>
<body>
  <div id="editor"></div>
</body>
</html>
